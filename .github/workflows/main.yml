name: Navagraha Platform CI

on:
  push:
    branches: [ "main" ]
  # Every PR, including ones stacked on another PR's branch.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: navagraha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run Typecheck
      run: npx tsc --noEmit

    - name: Build JS bundles
      run: npm run build

    - name: Unit tests
      run: npm test

    # Wallet, refund, billing, earnings and marketplace-pause behaviour against a real,
    # disposable Postgres (serial: the suites share one database and its migrations).
    - name: Database tests
      env:
        TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/navagraha_test
      run: npx vitest run --config vitest.config.ts --no-file-parallelism tests/unit/*.db.test.ts

    # #117: the same suites with Node and the Postgres session in Asia/Kolkata (fresh database), and the
    # report refund suites with Node and Postgres in different zones, both ways round.
    - name: Database tests (Node and Postgres in Asia/Kolkata)
      env:
        PGPASSWORD: postgres
        TZ: Asia/Kolkata
        TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/navagraha_test_ist?options=-c%20TimeZone%3DAsia%2FKolkata
      run: |
        psql -h localhost -U postgres -c 'CREATE DATABASE navagraha_test_ist'
        npx vitest run --config vitest.config.ts --no-file-parallelism tests/unit/*.db.test.ts

    - name: Report refund tests (Node UTC, Postgres Asia/Kolkata)
      env:
        PGPASSWORD: postgres
        TZ: UTC
        TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/navagraha_test_mixed_a?options=-c%20TimeZone%3DAsia%2FKolkata
      run: |
        psql -h localhost -U postgres -c 'CREATE DATABASE navagraha_test_mixed_a'
        npx vitest run --config vitest.config.ts --no-file-parallelism tests/unit/report-orders.db.test.ts tests/unit/report-refund-timezones.db.test.ts

    - name: Report refund tests (Node Asia/Kolkata, Postgres UTC)
      env:
        PGPASSWORD: postgres
        TZ: Asia/Kolkata
        TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/navagraha_test_mixed_b?options=-c%20TimeZone%3DUTC
      run: |
        psql -h localhost -U postgres -c 'CREATE DATABASE navagraha_test_mixed_b'
        npx vitest run --config vitest.config.ts --no-file-parallelism tests/unit/report-orders.db.test.ts tests/unit/report-refund-timezones.db.test.ts
